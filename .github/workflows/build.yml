name: Build & Package

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ master, main, modernization-*, beta, mac ]
  pull_request:
    branches: [ master, main, beta, mac ]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt_version: [6]

    name: Build (Qt${{ matrix.qt_version }})
# AppImage portion disabled as requested
#    name: Build (Qt${{ matrix.qt_version }}) & AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libmxml-dev libusb-1.0-0-dev zlib1g-dev \
            libv4l-dev liblo-dev libopencv-dev \
            wine-stable wine32 nlohmann-json3-dev \
            wget file gcc-multilib g++-multilib

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev qt6-l10n-tools libxkbcommon-dev

      - name: Build 32-bit Wine Bridge (Pass 1)
        run: |
          sudo apt-get install -y wine32-tools libwine-dev:i386
          mkdir build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=ON
          make NPClient32 FreeTrackClient32
          mkdir -p ../dist32
          # Use find to locate and copy shared objects, handling potential subdirectory changes
          find . -name "NPClient.dll.so" -exec cp {} ../dist32/ \;
          find . -name "FreeTrackClient.dll.so" -exec cp {} ../dist32/ \;
          cd ..
          sudo apt-get remove -y wine32-tools libwine-dev:i386
          sudo apt-get autoremove -y

      - name: Install X-Plane SDK headers
        run: |
          wget -q https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -O xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip. Contents:"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers:"
          ls /usr/include/xplane_sdk/XPLM/ | head -5

      - name: Build Main System (Pass 2)
        run: |
          sudo apt-get install -y wine64-tools libwine-dev
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_WINE32=OFF
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Install packaging tools
        run: |
          sudo apt-get install -y rpm desktop-file-utils

      - name: Build native packages
        run: |
          mkdir build_pkg
          cd build_pkg
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=OFF
          make -j$(nproc)
          cpack -G DEB
          cpack -G RPM

      - name: Upload native packages
        uses: actions/upload-artifact@v6
        with:
          name: Linuxtrack-Native-Packages
          path: |
            build_pkg/*.deb
            build_pkg/*.rpm

      - name: Generate AppImage
        env:
          BUILD_DIR: "build"
          APP_DIR: "AppDir"
          NO_STRIP: "1"
        run: |
          chmod +x packaging/appimage/make_appimage.sh
          bash packaging/appimage/make_appimage.sh
          # Rename to a standard name for easier handling in next job
          mv *.AppImage Linuxtrack-latest-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: Linuxtrack-AppImage
          path: Linuxtrack-latest-x86_64.AppImage

  validate-appimage:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.distro }}
    name: Validate (${{ matrix.distro }})
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download AppImage artifact
        uses: actions/download-artifact@v7
        with:
          name: Linuxtrack-AppImage

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb1 libxcb-cursor0 file

      - name: Run validation script
        run: |
          chmod +x scripts/validate_appimage.sh
          ./scripts/validate_appimage.sh Linuxtrack-latest-x86_64.AppImage

  validate-appimage-docker:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux, fedora]
    runs-on: ubuntu-latest
    name: Validate (${{ matrix.distro }} Container)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download AppImage artifact
        uses: actions/download-artifact@v7
        with:
          name: Linuxtrack-AppImage

      - name: Run smoke test (Docker)
        run: |
          chmod +x scripts/validate_appimage.sh
          
          # Manually run the docker test command from smoke_test.sh logic
          APPIMAGE_NAME="Linuxtrack-latest-x86_64.AppImage"
          VALIDATE_SCRIPT="scripts/validate_appimage.sh"
          
          DEP_CMD=""
          if [[ "${{ matrix.distro }}" == "archlinux" ]]; then
            DEP_CMD="pacman -Syu --noconfirm fuse2 libxcb xcb-util-cursor file libglvnd"
          else
            DEP_CMD="dnf install -y fuse fuse-libs libxcb file findutils libglvnd-glx libglvnd-opengl"
          fi

          docker run --privileged --rm \
            -v "$(pwd)/$APPIMAGE_NAME:/app/$APPIMAGE_NAME" \
            -v "$(pwd)/$VALIDATE_SCRIPT:/app/validate_appimage.sh" \
            -w /app \
            "${{ matrix.distro }}:latest" \
            bash -c "$DEP_CMD && ./validate_appimage.sh $APPIMAGE_NAME"

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    
    name: Build (Arch Linux)

    steps:
      - name: Install base tools
        run: |
          echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman -Syu --noconfirm base-devel git cmake ninja

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            libusb zlib v4l-utils liblo opencv \
            qt6-base qt6-tools nlohmann-json \
            mxml wine wget file onnxruntime \
            glu libx11 mesa lib32-glibc lib32-gcc-libs \
            lib32-zlib lib32-libusb lib32-libx11 lib32-mesa \
            lib32-libxml2 lib32-gnutls lib32-glu \
            lib32-freetype2 lib32-fontconfig lib32-attr \
            lib32-glibc lib32-gcc-libs \
            mingw-w64-gcc

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Test libusb linking
        run: |
          echo "Checking libusb linkage..."
          ldd build/src/libltusb1.so | grep libusb || echo "libltusb1.so not found or no libusb dependency"
          echo "Build completed successfully on Arch Linux"

  build-macos:
    runs-on: macos-14
    name: Build (macOS ARM64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install qt@6 opencv cmake ninja pkg-config libmxml libusb nlohmann-json

      - name: Install X-Plane SDK headers
        run: |
          curl -sL https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -o xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/local/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/local/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/local/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/local/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers to /usr/local/include/xplane_sdk/"
          ls /usr/local/include/xplane_sdk/XPLM/ | head -5

      - name: Configure CMake
        run: |
          chmod +x scripts/configure_macos_experimental.sh
          ./scripts/configure_macos_experimental.sh build_macos stage_macos -G Ninja

      - name: Build
        run: |
          cd build_macos
          ninja

      - name: Run Tests
        run: |
          cd build_macos
          ctest --output-on-failure

      - name: Install and Package
        run: |
          cd build_macos
          ninja install
          cd ../stage_macos
          # Create a zip of the staged installation
          zip -r ../Linuxtrack-macOS-ARM64-experimental.zip .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: Linuxtrack-macOS-ARM64-experimental
          path: Linuxtrack-macOS-ARM64-experimental.zip
