name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-24.04
    name: Build and Release AppImage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libmxml-dev libusb-1.0-0-dev zlib1g-dev \
            libv4l-dev liblo-dev libopencv-dev \
            wine-stable wine32 nlohmann-json3-dev \
            wget file gcc-multilib g++-multilib \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            qt6-l10n-tools libxkbcommon-dev

      - name: Download Catch2 for tests
        run: |
          mkdir -p src/tests/catch2
          wget -q https://github.com/catchorg/Catch2/releases/download/v3.4.0/catch_amalgamated.hpp -O src/tests/catch2/catch_amalgamated.hpp
          wget -q https://github.com/catchorg/Catch2/releases/download/v3.4.0/catch_amalgamated.cpp -O src/tests/catch2/catch_amalgamated.cpp

      - name: Build 32-bit Wine Bridge (Pass 1)
        run: |
          sudo apt-get install -y wine32-tools libwine-dev:i386
          mkdir build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=ON
          make NPClient32 FreeTrackClient32
          mkdir -p ../dist32
          find . -name "NPClient.dll.so" -exec cp {} ../dist32/ \;
          find . -name "FreeTrackClient.dll.so" -exec cp {} ../dist32/ \;
          cd ..
          sudo apt-get remove -y wine32-tools libwine-dev:i386
          sudo apt-get autoremove -y

      - name: Install X-Plane SDK headers
        run: |
          wget -q https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -O xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip. Contents:"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers:"
          ls /usr/include/xplane_sdk/XPLM/ | head -5

      - name: Build Main System (Pass 2)
        run: |
          sudo apt-get install -y wine64-tools libwine-dev
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_WINE32=OFF
          make -j$(nproc)

      - name: Install packaging tools
        run: |
          sudo apt-get install -y rpm desktop-file-utils

      - name: Build Native Packages
        run: |
          mkdir build_pkg
          cd build_pkg
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=OFF
          make -j$(nproc)
          cpack -G DEB
          cpack -G RPM

      - name: Generate Slim AppImage
        env:
          BUILD_DIR: "build"
          APP_DIR: "AppDir"
          STRIP: "true"
        run: |
          chmod +x packaging/appimage/make_appimage.sh
          # Our optimized script already handles exclusions and manual strip
          bash packaging/appimage/make_appimage.sh
          mv Linuxtrack-x86_64.AppImage Linuxtrack-${{ github.ref_name }}-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Linuxtrack-*-x86_64.AppImage
            build_pkg/*.deb
            build_pkg/*.rpm
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
