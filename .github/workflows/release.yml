name: Publish Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    name: Build Linux Artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libmxml-dev libusb-1.0-0-dev zlib1g-dev \
            libv4l-dev liblo-dev libopencv-dev \
            wine-stable wine32 nlohmann-json3-dev \
            wget file gcc-multilib g++-multilib \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            qt6-l10n-tools libxkbcommon-dev

      - name: Build 32-bit Wine Bridge (Pass 1)
        run: |
          sudo apt-get install -y wine32-tools libwine-dev:i386
          mkdir build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=ON
          make NPClient32 FreeTrackClient32
          mkdir -p ../dist32
          find . -name "NPClient.dll.so" -exec cp {} ../dist32/ \;
          find . -name "FreeTrackClient.dll.so" -exec cp {} ../dist32/ \;
          cd ..
          sudo apt-get remove -y wine32-tools libwine-dev:i386
          sudo apt-get autoremove -y

      - name: Install X-Plane SDK headers
        run: |
          wget -q https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -O xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip. Contents:"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers:"
          ls /usr/include/xplane_sdk/XPLM/ | head -5

      - name: Build Main System (Pass 2)
        run: |
          sudo apt-get install -y wine64-tools libwine-dev
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_WINE32=OFF
          make -j$(nproc)

      - name: Install packaging tools
        run: |
          sudo apt-get install -y rpm desktop-file-utils

      - name: Build Native Packages
        run: |
          mkdir build_pkg
          cd build_pkg
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_WINE32=OFF
          make -j$(nproc)
          cpack -G DEB
          cpack -G RPM

      - name: Generate Slim AppImage
        env:
          BUILD_DIR: "build"
          APP_DIR: "AppDir"
          STRIP: "true"
        run: |
          chmod +x packaging/appimage/make_appimage.sh
          bash packaging/appimage/make_appimage.sh
          mv Linuxtrack-x86_64.AppImage Linuxtrack-${{ github.ref_name }}-x86_64.AppImage

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist
          cp Linuxtrack-*-x86_64.AppImage dist/
          cp build_pkg/*.deb dist/
          cp build_pkg/*.rpm dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-artifacts
          path: dist/*

  build-macos-arm64:
    runs-on: macos-14
    name: Build macOS ARM64 Artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install qt@6 opencv cmake ninja pkg-config libmxml libusb nlohmann-json create-dmg

      - name: Install X-Plane SDK headers
        run: |
          curl -sL https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -o xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/local/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/local/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/local/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/local/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers to /usr/local/include/xplane_sdk/"
          ls /usr/local/include/xplane_sdk/XPLM/ | head -5

      - name: Configure CMake
        run: |
          chmod +x scripts/configure_macos_experimental.sh
          ./scripts/configure_macos_experimental.sh build_macos stage_macos -G Ninja

      - name: Build
        run: |
          cd build_macos
          ninja

      - name: Run Tests
        run: |
          cd build_macos
          ctest --output-on-failure

      - name: Install and Package
        run: |
          cd build_macos
          ninja install
          cd ../stage_macos
          # Bundle Qt dependencies
          macdeployqt Linuxtrack.app -always-overwrite
          # Create DMG installer
          chmod +x ../scripts/make_macos_dmg.sh
          ../scripts/make_macos_dmg.sh .
          mv Linuxtrack-macOS-Installer.dmg ../Linuxtrack-${{ github.ref_name }}-macOS-ARM64.dmg
          # Also create zip as fallback
          zip -r ../Linuxtrack-${{ github.ref_name }}-macOS-ARM64-experimental.zip .

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist
          cp Linuxtrack-*-macOS-ARM64.dmg dist/ || true
          cp Linuxtrack-*-macOS-ARM64-experimental.zip dist/
          ls -la dist/

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-artifacts
          path: dist/*

  build-macos-intel:
    runs-on: macos-13
    name: Build macOS Intel Artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install qt@6 opencv cmake ninja pkg-config libmxml libusb nlohmann-json create-dmg

      - name: Install X-Plane SDK headers
        run: |
          curl -sL https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip -o xpsdk.zip
          unzip -q xpsdk.zip -d xpsdk_tmp
          XPLM_HEADER=$(find xpsdk_tmp -name "XPLMPlugin.h" | head -1)
          WIDGETS_HEADER=$(find xpsdk_tmp -name "XPWidgets.h" | head -1)
          if [ -z "$XPLM_HEADER" ]; then
            echo "ERROR: XPLMPlugin.h not found in SDK zip"
            find xpsdk_tmp -name "*.h" | head -20
            exit 1
          fi
          XPLM_DIR=$(dirname "$XPLM_HEADER")
          WIDGETS_DIR=$(dirname "$WIDGETS_HEADER")
          echo "XPLM headers found at: $XPLM_DIR"
          echo "Widget headers found at: $WIDGETS_DIR"
          sudo mkdir -p /usr/local/include/xplane_sdk/XPLM
          sudo mkdir -p /usr/local/include/xplane_sdk/Widgets
          sudo cp "$XPLM_DIR"/*.h /usr/local/include/xplane_sdk/XPLM/
          sudo cp "$WIDGETS_DIR"/*.h /usr/local/include/xplane_sdk/Widgets/
          echo "Installed XPLM headers to /usr/local/include/xplane_sdk/"
          ls /usr/local/include/xplane_sdk/XPLM/ | head -5

      - name: Configure CMake
        run: |
          chmod +x scripts/configure_macos_experimental.sh
          ./scripts/configure_macos_experimental.sh build_macos stage_macos -G Ninja

      - name: Build
        run: |
          cd build_macos
          ninja

      - name: Run Tests
        run: |
          cd build_macos
          ctest --output-on-failure

      - name: Install and Package
        run: |
          cd build_macos
          ninja install
          cd ../stage_macos
          # Bundle Qt dependencies
          macdeployqt Linuxtrack.app -always-overwrite
          # Create DMG installer
          chmod +x ../scripts/make_macos_dmg.sh
          ../scripts/make_macos_dmg.sh .
          mv Linuxtrack-macOS-Installer.dmg ../Linuxtrack-${{ github.ref_name }}-macOS-x86_64.dmg
          # Also create zip as fallback
          zip -r ../Linuxtrack-${{ github.ref_name }}-macOS-x86_64-experimental.zip .

      - name: Collect macOS Intel artifacts
        run: |
          mkdir -p dist
          cp Linuxtrack-*-macOS-x86_64.dmg dist/ || true
          cp Linuxtrack-*-macOS-x86_64-experimental.zip dist/
          ls -la dist/

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-intel-artifacts
          path: dist/*

  publish-release:
    needs: [build-linux, build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest
    name: Publish GitHub Release

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-artifacts
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-artifacts
          path: artifacts/

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-intel-artifacts
          path: artifacts/

      - name: List artifacts
        run: |
          echo "All artifacts:"
          find artifacts/ -type f

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              artifacts/*.AppImage \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/*.dmg \
              artifacts/*.zip \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              artifacts/*.AppImage \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/*.dmg \
              artifacts/*.zip \
              --repo "${{ github.repository }}" \
              --generate-notes \
              --latest
          fi
